name: Java CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      - name: Maven Test
        run: mvn test

      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONARQUBE_TOKEN }} \
            -Dsonar.projectKey=MyWebApp

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Deploy to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn deploy \
            -DskipTests \
            -s settings.xml

      - name: Deploy to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME}}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD}}
        run: |
          curl -u "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            -T target/MyWebApp-0.0.1.war \
            "$TOMCAT_URL/manager/text/deploy?path=/MyWebApp&update=true"
      
      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"✅ MyWebApp CI/CD pipeline SUCCESS! Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"❌ MyWebApp CI/CD pipeline FAILED! Branch: ${{ github.ref_name }} | Check GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"